<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2783b2">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/src/app.css" as="style">
  <link rel="stylesheet" href="/src/app.css">
  <link rel="prefetch" href="/dashboard.html"><link rel="prefetch" href="/pacientes.html"><link rel="prefetch" href="/medicos.html">
  <title>MediFlow | Consultas</title>
</head>
<body>
<div class="sistema">
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#logo"></use></svg></div><div><strong>MediFlow</strong><small>Gestão Clínica</small></div></div>
    <nav class="menu"><a href="/dashboard.html"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#dashboard"></use></svg><span>Dashboard</span></a><a href="/pacientes.html"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#users"></use></svg><span>Pacientes</span></a><a href="/medicos.html"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#doctor"></use></svg><span>Médicos</span></a><a href="/consultas.html" class="ativo"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#calendar"></use></svg><span>Consultas</span></a></nav>
    <button class="btn-sair" type="button"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#logout"></use></svg><span>Sair</span></button>
  </aside>
  <main class="conteudo">
    <header class="topbar"><div><h1>Consultas</h1><p>Agendamento e acompanhamento das consultas.</p></div><div class="usuario"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#user"></use></svg><span class="nome-usuario"></span></div></header>
    
<section class="painel">
  <div class="painel-topo"><h2 id="tituloForm">Agendar consulta</h2></div>
  <form id="formConsulta" class="form-grid">
    <input type="hidden" id="consultaId">
    <div class="campo"><label for="pacienteId">Paciente</label><select id="pacienteId" required></select></div>
    <div class="campo"><label for="medicoId">Médico</label><select id="medicoId" required></select></div>
    <div class="campo"><label for="data">Data e horário</label><input id="data" type="datetime-local" required></div>
    <div class="campo"><label for="status">Status</label><select id="status" disabled><option value="AGENDADA">AGENDADA</option></select></div>
    <div class="botoes-form"><button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#save"></use></svg><span>Salvar consulta</span></button><button type="button" class="btn btn-secundario" id="btnCancelar"><svg class="icon" aria-hidden="true"><use href="/mediflow-icons.svg#x"></use></svg><span>Cancelar edição</span></button></div>
  </form>
</section>
<section class="painel"><div class="painel-topo"><h2>Consultas cadastradas</h2></div><div class="tabela-container"><table><thead><tr><th>Paciente</th><th>Médico</th><th>Especialidade</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody id="listaConsultas"></tbody></table></div></section>
  </main>
</div>
<script type="module" src="/src/consultas.js"></script>
</body>
</html>
